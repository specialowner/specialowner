<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Special Owner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e5f">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="app-shell">
  <div class="center-screen" id="authScreen">
    <div class="logo-mark">SO</div>
    <h2 style="margin-bottom:4px">Special Owner</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:24px">Your residential compound, in one app</p>

    <div class="role-toggle" id="modeToggle">
      <button class="active" data-mode="login">Log in</button>
      <button data-mode="register">Sign up</button>
    </div>

    <form id="authForm" style="width:100%;text-align:left">
      <div class="field" id="nameField" style="display:none">
        <label>Full name</label>
        <input type="text" id="fullName" placeholder="e.g. Ahmed Salama">
      </div>
      <div class="field" id="unitField" style="display:none">
        <label>Unit / Villa number</label>
        <input type="text" id="unitNumber" placeholder="e.g. B-204">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <p class="error-text" id="authError" style="display:none"></p>
      <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
    </form>

    <p style="font-size:11px;color:var(--muted);margin-top:22px">
      By continuing you agree to the <a href="privacy-policy.html" style="text-decoration:underline">Privacy Policy</a>
    </p>
  </div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
